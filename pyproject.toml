[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-cc-sightline"
version = "0.4.0"
description = "Click heatmaps, scroll maps and session replay for Django, with an admin panel and a live overlay."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Qiyas Sadıqov", email = "qiyasturk@gmail.com" }]
keywords = ["django", "heatmap", "analytics", "session replay", "click map", "scroll map"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = ["Django>=4.2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-django", "ruff"]

[project.urls]
Homepage = "https://github.com/qiyascc/django-sightline"
Source = "https://github.com/qiyascc/django-sightline"
Documentation = "https://django-cc-sightline.readthedocs.io/"
Issues = "https://github.com/qiyascc/django-sightline/issues"
Changelog = "https://github.com/qiyascc/django-sightline/blob/main/CHANGELOG.md"
Author = "https://qiyas.cc"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sightline = ["static/sightline/**/*", "templates/sightline/*.html"]

[tool.ruff]
line-length = 96
target-version = "py310"
